<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Order Confirmed — BE/TON Kyoto</title>
  <meta name="robots" content="noindex" />
  <link rel="apple-touch-icon" sizes="180x180" href="/images/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon-16x16.png">
  <link rel="manifest" href="/images/site.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@300;500;700;900&family=Big+Shoulders+Inline+Text:wght@300;500;700;900&family=Inter:wght@200;300;400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/beton.css" />
  <style>
    .success-page {
      min-height: calc(100vh - 120px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2rem;
      padding: 4rem 2rem;
      text-align: center;
      border-bottom: 0.5px solid var(--black-border);
    }
    .success-mark {
      font-family: 'Inter', sans-serif; font-weight: 700;
      font-size: 80px;
      color: var(--red);
      line-height: 1;
    }
    .success-label {
      font-size: var(--text-xs);
      letter-spacing: var(--ls-wide);
      color: var(--white-muted);
    }
    .success-title {
      font-family: 'Inter', sans-serif; font-weight: 700;
      font-size: var(--text-h2);
      letter-spacing: var(--ls-normal);
      color: var(--white);
      line-height: 1;
    }
    .success-sub {
      font-size: var(--text-sm);
      color: var(--white-muted);
      letter-spacing: var(--ls-tight);
      line-height: var(--lh-body);
      max-width: 400px;
    }
    .success-id {
      font-size: var(--text-xs);
      letter-spacing: var(--ls-normal);
      color: var(--white-faint);
      padding: 0.8rem 1.5rem;
      border: 0.5px solid var(--black-border-strong);
    }
    .success-divider {
      width: 40px;
      height: 0.5px;
      background: var(--black-border-strong);
    }
    .success-links {
      display: flex;
      gap: 2rem;
      align-items: center;
    }
    .success-link {
      font-size: var(--text-nav);
      letter-spacing: var(--ls-normal);
      color: var(--white-dim);
      cursor: pointer;
      border-bottom: 0.5px solid var(--white-faint);
      padding-bottom: 0.2rem;
      transition: color 0.2s, border-color 0.2s;
      text-decoration: none;
    }
    .success-link:hover { color: var(--red); border-color: var(--red); }
    .success-kyoto {
      font-family: 'Inter', sans-serif; font-weight: 700;
      font-size: var(--text-h3);
      letter-spacing: var(--ls-wide);
      color: var(--red);
    }

    @media (max-width: 768px) {
      .success-title { font-size: 36px; }
      .success-mark { font-size: 60px; }
      .success-links { flex-direction: column; gap: 1rem; }
    }
  </style>
</head>
<body>

<div id="betonNav"></div>

<div class="success-page">
  <div class="success-mark">/</div>
  <div class="success-label" id="successLabel">ORDER CONFIRMED</div>
  <div class="success-title" id="successTitle">SOMETHING HEAVY IS<br>ON ITS WAY.</div>
  <div class="success-sub" id="successSub">
    Your order has been placed. You will receive a confirmation email shortly.<br><br>
    Handcast in Kyoto. Ships within 3–5 business days.
  </div>
  <div class="success-id" id="successId">—</div>
  <div class="success-divider"></div>
  <div class="success-kyoto">京都</div>
  <div class="success-links">
    <a class="success-link" href="/shop" id="linkShop">BACK TO SHOP</a>
    <a class="success-link" href="/" id="linkHome">HOME</a>
  </div>
</div>

<div id="betonFooter"></div>

<script src="/js/beton.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    const params = new URLSearchParams(window.location.search);
    const paymentIntent = params.get('payment_intent');
    const status = params.get('redirect_status');
    const isJP = document.body.classList.contains('lang-jp');

    if (status === 'succeeded') {
      localStorage.removeItem('beton_cart');
      if (paymentIntent) {
        document.getElementById('successId').textContent =
          'ORDER #' + paymentIntent.slice(-8).toUpperCase();
      }
      // JP success translations
      if (isJP) {
        document.getElementById('successLabel').textContent = '注文完了';
        document.getElementById('successTitle').innerHTML = '重いものが<br>向かっています。';
        document.getElementById('successSub').innerHTML =
          'ご注文ありがとうございます。確認メールをお送りします。<br><br>京都で手作り。3〜5営業日以内に発送。';
        document.getElementById('linkShop').textContent = 'ショップへ戻る';
        document.getElementById('linkHome').textContent = 'ホーム';
      }
    } else if (status === 'processing') {
      localStorage.removeItem('beton_cart'); // clear cart — payment is in flight, don't allow re-order
      if (isJP) {
        document.getElementById('successLabel').textContent = '処理中';
        document.getElementById('successTitle').innerHTML = 'お支払いを<br>処理しています。';
        document.getElementById('successSub').textContent =
          'まもなく確認メールをお送りします。';
      } else {
        document.getElementById('successTitle').innerHTML = 'PROCESSING<br>YOUR ORDER.';
        document.getElementById('successSub').textContent =
          'Payment is being processed. You will receive a confirmation email shortly.';
      }
    } else {
      window.location.href = '/checkout';
    }
  });
</script>
<script defer src="/_vercel/speed-insights/script.js"></script>
</body>
</html>
