.not-found-inner {
  display: grid;
  place-items: center;
}

/* both children share the same grid cell, stacking on top of each other */
.not-found-inner > * {
  grid-area: 1 / 1;
}

.not-found-bg {
  font-family: 'Big Shoulders Inline Text', sans-serif;
  font-weight: 900;
  font-size: clamp(200px, 45vw, 420px);
  color: #1c1c1c;
  line-height: 1;
  user-select: none;
  letter-spacing: -4px;
  pointer-events: none;
  white-space: nowrap;
  z-index: 1;
}

.not-found-content {
  position: relative;
  z-index: 2;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 1.5rem;
}

.not-found-label {
  font-size: var(--text-xs);
  letter-spacing: var(--ls-wide);
  color: var(--white-faint);
}

.not-found-title {
  font-family: 'Big Shoulders Inline Text', sans-serif;
  font-size: clamp(42px, 10vw, 80px);
  letter-spacing: 2px;
  line-height: 1;
  color: var(--white);
}

.not-found-sub {
  font-size: var(--text-xs);
  letter-spacing: var(--ls-normal);
  color: red;
}

.not-found-jp {
  font-size: var(--text-xs);
  letter-spacing: var(--ls-normal);
  color: var(--white-faint);
  margin-top: -0.5rem;
}

.not-found-divider {
  width: 0.5px;
  height: 48px;
  background: var(--black-border-strong);
}

.not-found-back {
  font-size: var(--text-nav);
  letter-spacing: var(--ls-normal);
  color: var(--white-dim);
  text-decoration: none;
  border-bottom: 0.5px solid var(--white-faint);
  padding-bottom: 2px;
  transition: color 0.2s, border-color 0.2s;
}

.not-found-back:hover {
  color: var(--red);
  border-color: var(--red);
}

@media (max-width: 768px) {
  .not-found-wrap { padding: 3rem 1.5rem; }
}
